<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f7f1"><meta name="description" content="心靈療癒室的私人心情日記：把心情留在自己的瀏覽器，不需註冊。"><title>心情日記｜心靈療癒室</title><link rel="stylesheet" href="assets/css/style.css"><script src="assets/js/app.js" defer></script></head>
<body data-page="journal"><a class="skip-link" href="#main">跳至主要內容</a><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-icon">✿</span><span>心靈療癒室<small>THE GENTLE ROOM</small></span></a><nav class="nav" aria-label="主要導覽"><a href="index.html">首頁</a><a href="index.html#library">療癒文章</a><a href="practice.html">放鬆練習</a><a class="current" href="journal.html">心情日記</a><a href="guide.html">網站指南</a></nav><a class="nav-highlight" href="index.html#library">讀一篇文章 ↗</a></div></header>
<main id="main" class="inner-page"><div class="container narrow"><div class="page-intro center"><img class="page-intro-illustration" src="assets/illustrations/sticker-bunny.svg" alt="小兔子插畫" width="250" height="260" loading="lazy"><span class="mini-label">DEAR ME,</span><h1>把今天的心情，<span>寫下來。</span></h1><p>不用寫得完整，也不用為感受打分數。這裡只是一個給自己的小角落。</p></div>
<div class="journal-card"><div class="journal-header"><span>✎　今天的小記</span><time id="journal-today"></time></div><form id="journal-form"><fieldset class="journal-moods"><legend>今天的心情比較接近哪一種？</legend><div class="journal-mood-options"><label><input type="radio" name="mood" value="開心"><span>☀️ 開心</span></label><label><input type="radio" name="mood" value="平靜"><span>🌿 平靜</span></label><label><input type="radio" name="mood" value="疲憊"><span>☁️ 疲憊</span></label><label><input type="radio" name="mood" value="難過"><span>🌧️ 難過</span></label><label><input type="radio" name="mood" value="焦慮"><span>🌙 焦慮</span></label></div></fieldset><label class="field-label" for="journal-text">今天想對自己說什麼？</label><textarea id="journal-text" rows="7" maxlength="3000" placeholder="今天發生了什麼？有什麼想放下、想記得的事？或只寫下一句話也可以。" required></textarea><div class="form-footer"><small>資料只保存在這台裝置的這個瀏覽器，不會上傳至網站伺服器；使用共用裝置時請留意隱私。</small><button class="btn btn-primary" type="submit">儲存這篇日記 ♡</button></div><p id="journal-status" class="status-message" role="status"></p></form></div>
<div class="journal-history"><div class="history-head"><div><span class="mini-label">YOUR PAST MOMENTS</span><h2>留給自己的文字</h2></div><button type="button" class="text-button" id="journal-clear">清除所有日記</button></div><div id="journal-list" class="history-list"><p class="muted">尚未留下日記，從今天開始也很好。</p></div></div></div></main><footer class="site-footer"><div class="container footer-simple"><span>✿ 心靈療癒室</span><small>日記儲存在目前瀏覽器的 localStorage；清除網站資料後無法復原。</small></div></footer></body></html>
